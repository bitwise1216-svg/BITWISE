<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f3f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgLight6)"/>

  <!-- Framing -->
  <path d="M 32 52 L 32 32 L 52 32" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>
  <path d="M 768 52 L 768 32 L 748 32" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>
  <path d="M 32 548 L 32 568 L 52 568" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>
  <path d="M 768 548 L 768 568 L 748 568" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>

  <!-- Metadata -->
  <text x="48" y="52" fill="rgba(0,0,0,0.6)" font-family="monospace" font-size="11" font-weight="600" letter-spacing="2">SPEC.06 // SPATIAL OS RUNTIME HUD</text>
  <text x="752" y="52" fill="rgba(0,0,0,0.4)" font-family="monospace" font-size="11" letter-spacing="2" text-anchor="end">KERNEL: VERIFIED</text>
  <text x="48" y="556" fill="rgba(0,0,0,0.4)" font-family="monospace" font-size="10" letter-spacing="1">LATENCY: 0.8ms</text>
  <text x="752" y="556" fill="rgba(0,0,0,0.5)" font-family="monospace" font-size="10" letter-spacing="2" text-anchor="end">SWISS DIGITAL SPEC</text>

  <!-- HUD Telemetry & Circular Compass UI -->
  <g transform="translate(400, 280)">
    <circle r="150" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <circle r="130" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="1.5" stroke-dasharray="12 8 4 8"/>
    <circle r="90" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
    <circle r="50" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/>

    <!-- Cardinal Crosshair lines -->
    <line x1="-165" y1="0" x2="-135" y2="0" stroke="#0a0a0c" stroke-width="1.5"/>
    <line x1="135" y1="0" x2="165" y2="0" stroke="#0a0a0c" stroke-width="1.5"/>
    <line x1="0" y1="-165" x2="0" y2="-135" stroke="#0a0a0c" stroke-width="1.5"/>
    <line x1="0" y1="135" x2="0" y2="165" stroke="#0a0a0c" stroke-width="1.5"/>

    <!-- Central Micro Reticle (Pixel Square) -->
    <rect x="-4" y="-4" width="8" height="8" fill="#0a0a0c"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#0a0a0c" stroke-width="1"/>
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#0a0a0c" stroke-width="1"/>

    <!-- Telemetry box inside -->
    <rect x="60" y="-80" width="80" height="24" rx="4" fill="#ffffff" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
    <text x="100" y="-64" fill="rgba(0,0,0,0.7)" font-family="monospace" font-size="9" font-weight="600" text-anchor="middle">ACTIVE</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(400, 470)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#ffffff" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
    <text x="0" y="4" fill="rgba(0,0,0,0.8)" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">HYPERION OS // LIVE SPACE</text>
  </g>
</svg>
