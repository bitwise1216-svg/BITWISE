<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f4f8"/>
    </linearGradient>
    <pattern id="isometricLight" width="60" height="34.64" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 17.32 L 30 34.64 L 0 17.32 Z" fill="none" stroke="rgba(0,0,0,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bgLight2)"/>
  <rect width="800" height="600" fill="url(#isometricLight)"/>

  <!-- Framing Marks -->
  <path d="M 32 52 L 32 32 L 52 32" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>
  <path d="M 768 52 L 768 32 L 748 32" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>
  <path d="M 32 548 L 32 568 L 52 568" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>
  <path d="M 768 548 L 768 568 L 748 568" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>

  <!-- Metadata -->
  <text x="48" y="52" fill="rgba(0,0,0,0.6)" font-family="monospace" font-size="11" font-weight="600" letter-spacing="2">SPEC.02 // SYNAPSE CRYPTO LATTICE</text>
  <text x="752" y="52" fill="rgba(0,0,0,0.4)" font-family="monospace" font-size="11" letter-spacing="2" text-anchor="end">AUTONOMOUS PROTOCOL</text>
  <text x="48" y="556" fill="rgba(0,0,0,0.4)" font-family="monospace" font-size="10" letter-spacing="1">NODE_CLUSTER: #902-ALPHA</text>
  <text x="752" y="556" fill="rgba(0,0,0,0.5)" font-family="monospace" font-size="10" letter-spacing="2" text-anchor="end">SWISS DIGITAL SPEC</text>

  <!-- Central Isometric Lattice & Neural Nodes -->
  <g transform="translate(400, 290)">
    <g stroke="#0a0a0c" stroke-width="1.5" fill="none">
      <!-- Top Cube -->
      <polygon points="0,-120 60,-85 0,-50 -60,-85" fill="rgba(0,0,0,0.03)"/>
      <polygon points="0,-50 60,-85 60,-15 0,20" fill="rgba(0,0,0,0.06)"/>
      <polygon points="-60,-85 0,-50 0,20 -60,-15" fill="rgba(0,0,0,0.09)"/>
      
      <!-- Right Cube -->
      <polygon points="90,-30 150,5 90,40 30,5" fill="rgba(0,0,0,0.03)"/>
      <polygon points="90,40 150,5 150,75 90,110" fill="rgba(0,0,0,0.06)"/>
      <polygon points="30,5 90,40 90,110 30,75" fill="rgba(0,0,0,0.09)"/>

      <!-- Left Cube -->
      <polygon points="-90,-30 -30,5 -90,40 -150,5" fill="rgba(0,0,0,0.03)"/>
      <polygon points="-90,40 -30,5 -30,75 -90,110" fill="rgba(0,0,0,0.06)"/>
      <polygon points="-150,5 -90,40 -90,110 -150,75" fill="rgba(0,0,0,0.09)"/>
    </g>

    <!-- Vector Interconnects -->
    <line x1="0" y1="-50" x2="90" y2="40" stroke="rgba(0,0,0,0.4)" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="0" y1="-50" x2="-90" y2="40" stroke="rgba(0,0,0,0.4)" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="-90" y1="40" x2="90" y2="40" stroke="rgba(0,0,0,0.4)" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Vertices -->
    <rect x="-4" y="-54" width="8" height="8" fill="#0a0a0c"/>
    <rect x="86" y="36" width="8" height="8" fill="#0a0a0c"/>
    <rect x="-94" y="36" width="8" height="8" fill="#0a0a0c"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(400, 470)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#ffffff" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
    <text x="0" y="4" fill="rgba(0,0,0,0.8)" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">SYNAPSE MATRIX // LIVE SPACE</text>
  </g>
</svg>
