    <rect x="-4" y="-4" width="8" height="8" fill="#16a34a"/>

    <rect x="-106" y="-76" width="12" height="12" fill="#ffffff" stroke="#0a0a0c" stroke-width="1.5"/>
    <rect x="94" y="-76" width="12" height="12" fill="#ffffff" stroke="#0a0a0c" stroke-width="1.5"/>
