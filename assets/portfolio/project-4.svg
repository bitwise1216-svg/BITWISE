      <line x1="0" y1="0" x2="120" y2="60"/>
      <line x1="0" y1="0" x2="-120" y2="60"/>
      <line x1="0" y1="0" x2="0" y2="130"/>
      <line x1="-100" y1="-70" x2="100" y2="-70"/>
      <line x1="100" y1="-70" x2="120" y2="60"/>
      <line x1="120" y1="60" x2="0" y2="130"/>
      <line x1="0" y1="130" x2="-120" y2="60"/>
