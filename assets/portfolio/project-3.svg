<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f7"/>
    </linearGradient>
    <pattern id="dotLight3" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="11" y="11" width="2" height="2" fill="rgba(0,0,0,0.08)"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bgLight3)"/>
  <rect width="800" height="600" fill="url(#dotLight3)"/>

  <!-- Framing -->
  <path d="M 32 52 L 32 32 L 52 32" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>
  <path d="M 768 52 L 768 32 L 748 32" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>
  <path d="M 32 548 L 32 568 L 52 568" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>
  <path d="M 768 548 L 768 568 L 748 568" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>

  <!-- Metadata -->
  <text x="48" y="52" fill="rgba(0,0,0,0.6)" font-family="monospace" font-size="11" font-weight="600" letter-spacing="2">SPEC.03 // VARIABLE TYPOGRAPHY ENGINE</text>
  <text x="752" y="52" fill="rgba(0,0,0,0.4)" font-family="monospace" font-size="11" letter-spacing="2" text-anchor="end">AXIS: wght[100..900]</text>
  <text x="48" y="556" fill="rgba(0,0,0,0.4)" font-family="monospace" font-size="10" letter-spacing="1">GLYPH SET: UNICODE 15.0</text>
  <text x="752" y="556" fill="rgba(0,0,0,0.5)" font-family="monospace" font-size="10" letter-spacing="2" text-anchor="end">SWISS DIGITAL SPEC</text>

  <!-- Central Kinetic Typographic Glyph Construction -->
  <g transform="translate(400, 280)">
    <!-- Baseline guidelines -->
    <line x1="-240" y1="-80" x2="240" y2="-80" stroke="rgba(0,0,0,0.12)" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="-240" y1="0" x2="240" y2="0" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <line x1="-240" y1="80" x2="240" y2="80" stroke="rgba(0,0,0,0.12)" stroke-width="1" stroke-dasharray="2 4"/>

    <!-- Large Geometric Glyph "B." in Pure Ink Black -->
    <text x="-80" y="55" fill="none" stroke="#0a0a0c" stroke-width="3" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="150" letter-spacing="-8">B</text>
    <rect x="36" y="30" width="22" height="22" fill="#0a0a0c"/>

    <!-- Vector Bezier Anchors -->
    <rect x="-83" y="-55" width="6" height="6" fill="#16a34a"/>
    <rect x="-83" y="50" width="6" height="6" fill="#16a34a"/>
    <rect x="-10" y="-30" width="6" height="6" fill="#2563eb"/>
    <rect x="15" y="10" width="6" height="6" fill="#2563eb"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(400, 470)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#ffffff" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
    <text x="0" y="4" fill="rgba(0,0,0,0.8)" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">CHRONO TYPE LAB // LIVE SPACE</text>
  </g>
</svg>
