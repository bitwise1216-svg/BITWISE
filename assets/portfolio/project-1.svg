<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f5f8"/>
    </linearGradient>
    <pattern id="lightGrid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bgLight1)"/>
  <rect width="800" height="600" fill="url(#lightGrid1)"/>

  <!-- Technical Framing Marks -->
  <path d="M 32 52 L 32 32 L 52 32" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>
  <path d="M 768 52 L 768 32 L 748 32" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>
  <path d="M 32 548 L 32 568 L 52 568" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>
  <path d="M 768 548 L 768 568 L 748 568" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>

  <!-- Telemetry Labels -->
  <text x="48" y="52" fill="rgba(0,0,0,0.6)" font-family="monospace" font-size="11" font-weight="600" letter-spacing="2">SPEC.01 // SPATIAL AUDIO PLATFORM</text>
  <text x="752" y="52" fill="rgba(0,0,0,0.4)" font-family="monospace" font-size="11" letter-spacing="2" text-anchor="end">48.2kHz · 32-BIT</text>
  <text x="48" y="556" fill="rgba(0,0,0,0.4)" font-family="monospace" font-size="10" letter-spacing="1">COORD: 37.7749° N, 122.4194° W</text>
  <text x="752" y="556" fill="rgba(0,0,0,0.5)" font-family="monospace" font-size="10" letter-spacing="2" text-anchor="end">SWISS DIGITAL SPEC</text>

  <!-- Central Kinetic Waveform Graphic -->
  <g transform="translate(400, 300)">
    <circle r="160" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
    <circle r="120" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1" stroke-dasharray="4 6"/>
    <circle r="80" fill="none" stroke="rgba(0,0,0,0.22)" stroke-width="1.5"/>
    <rect x="-4" y="-4" width="8" height="8" fill="#0a0a0c"/>
    
    <!-- Audio Waveform Paths -->
    <path d="M -180 0 Q -135 -60 -90 0 T 0 0 T 90 0 T 180 0" fill="none" stroke="#0a0a0c" stroke-width="2"/>
    <path d="M -180 0 Q -135 40 -90 0 T 0 0 T 90 0 T 180 0" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="1.5"/>
    <path d="M -180 0 Q -135 -20 -90 0 T 0 0 T 90 0 T 180 0" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>

    <!-- Crosshairs -->
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#0a0a0c" stroke-width="1.5"/>
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#0a0a0c" stroke-width="1.5"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(400, 470)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#ffffff" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
    <text x="0" y="4" fill="rgba(0,0,0,0.8)" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">AURA PLATFORM // LIVE SPACE</text>
  </g>
</svg>
